name: Weekly LLM Benchmark

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9AM UTC
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to GCP via Workload Identity
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: "projects/738128790851/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "llm-benchmarker-sa@llmbuddy-489602.iam.gserviceaccount.com"

      - name: Run benchmark
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BQ_DATASET: ${{ secrets.BQ_DATASET }}
        run: python main.py dev

      - name: Upload MLflow results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-results-${{ github.run_id }}
          path: mlflow.db
          retention-days: 30